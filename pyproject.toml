[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meshkit"
version = "0.5.0"
description = "Blender-free low-poly modelling toolkit for AI agents: closed-mesh primitives, modern aircraft / armour / warship kits, texture detail passes, checks, software previews, OBJ/glTF I/O, CLI and MCP server"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=9"]

[project.optional-dependencies]
silhouette = ["opencv-python-headless"]

[project.scripts]
meshkit = "meshkit.cli:main"
meshkit-mcp = "meshkit.mcp_server:main"

[tool.setuptools]
packages = ["meshkit"]

[tool.setuptools.package-data]
meshkit = ["AI_GUIDE.md"]
